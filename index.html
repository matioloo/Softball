  // Dirección del batazo
  function fieldSVG(dir) {
    var s = '<svg class="field-svg" viewBox="0 0 300 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Campo: toca hacia dónde fue el batazo">';
    s += '<path d="M150 235 L8.6 93.6 A200 200 0 0 1 291.4 93.6 Z" fill="#E4EFE6"/>';
    s += '<path d="M150 235 L105 190 L150 145 L195 190 Z" fill="#EADBC4" stroke="#000" stroke-width="1.2"/>';
    s += '<path d="M150 235 L8.6 93.6 M150 235 L291.4 93.6" stroke="#000" stroke-width="1.5" fill="none"/>';
    s += '<path d="M8.6 93.6 A200 200 0 0 1 291.4 93.6" stroke="#000" stroke-width="1.5" fill="none"/>';
    if (dir) {
      var len = Math.min(dir.r, 1.15) * 200;
      s += arrowSVG(150, 235, 150 + Math.sin(dir.a) * len, 235 - Math.cos(dir.a) * len, "#1E8E3E", 3, 12);
    }
    return s + "</svg>";
  }
  function fieldMenu() {
    var dir = ed.draft.dir;
    openMenu({
      title: "Toca hacia dónde fue el batazo",
      body: fieldSVG(dir),
      extras: dir ? [{ label: "Quitar dirección", pick: function () { change(function (d) { d.dir = null; }); closeMenu(); } }] : [],
      onField: function (e, svg) {
        var pt = svg.createSVGPoint();
        pt.x = e.clientX; pt.y = e.clientY;
        var p = pt.matrixTransform(svg.getScreenCTM().inverse());
        var dx = p.x - 150, dy = p.y - 235, r = Math.hypot(dx, dy) / 200;
        if (r < 0.05) return;
        change(function (d) { d.dir = { a: +Math.atan2(dx, -dy).toFixed(3), r: +r.toFixed(3) }; });
        closeMenu();
        toast("Dirección del batazo anotada.");
      }
    });
  }

  // ---------- Barra superior ----------
  document.querySelectorAll(".tab").forEach(function (b) {
    b.addEventListener("click", function () {
      var t = b.getAttribute("data-tab");
      if (t === active) return;
      active = t;
      render();
      ensureView();
    });
  });
  document.getElementById("fitBtn").addEventListener("click", fit);
  document.getElementById("menuBtn").addEventListener("click", function () {
    openPanel('<p class="panel-title">Opciones</p><div class="menu-list">' +
      '<button type="button" class="btn ghost" data-act="home">Menú principal</button>' +
      '<button type="button" class="btn ghost" data-act="export">Exportar este partido</button>' +
      '<button type="button" class="btn ghost" data-act="extra">Añadir inning extra</button>' +
      '<button type="button" class="btn ghost" data-act="cancel">Cerrar</button></div>', function (act) {
      if (act === "home") { closePanel(); backToHome(); }
      else if (act === "export") { closePanel(); if (currentRec) exportMenu(currentRec); }
      else if (act === "extra") { closePanel(); addExtraInning(); }
      else closePanel();
    });
  });

  // ---------- Partidos guardados en el móvil ----------
  var APP_VERSION = "4.0";
  var store = (function () {
    var dbp = null, useLS = false, LSK = "anotacion-softball:partidos";
    function idb() {
      if (!dbp) {
        dbp = new Promise(function (res, rej) {
          if (!window.indexedDB) { rej(new Error("sin almacén")); return; }
          var rq = indexedDB.open("anotacion-softball", 1);
          rq.onupgradeneeded = function () { rq.result.createObjectStore("partidos", { keyPath: "id" }); };
          rq.onsuccess = function () { res(rq.result); };
          rq.onerror = function () { rej(rq.error); };
        });
      }
      return dbp;
    }
    function tx(mode, fn) {
      return idb().then(function (db) {
        return new Promise(function (res, rej) {
          var t = db.transaction("partidos", mode), rq = fn(t.objectStore("partidos"));
          t.oncomplete = function () { res(rq ? rq.result : undefined); };
          t.onerror = function () { rej(t.error); };
          t.onabort = function () { rej(t.error); };
        });
      });
    }
    function lsAll() { try { return JSON.parse(localStorage.getItem(LSK) || "{}"); } catch (e) { return {}; } }
    return {
      all: function () {
        return tx("readonly", function (s) { return s.getAll(); }).catch(function () {
          useLS = true;
          var m = lsAll();
          return Object.keys(m).map(function (k) { return m[k]; });
        });
      },
      put: function (rec) {
        if (useLS) { var m = lsAll(); m[rec.id] = rec; localStorage.setItem(LSK, JSON.stringify(m)); return Promise.resolve(); }
        return tx("readwrite", function (s) { return s.put(rec); });
      },
      del: function (id) {
        if (useLS) { var m = lsAll(); delete m[id]; localStorage.setItem(LSK, JSON.stringify(m)); return Promise.resolve(); }
        return tx("readwrite", function (s) { return s.delete(id); });
      }
    };
  })();

  var games = [];
  var currentRec = null;
  var saveTimer = null;

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function byId(id) { return games.find(function (g) { return g.id === id; }); }
  function nextVersion(fam) {
    return games.filter(function (g) { return g.familia === fam; }).reduce(function (m, g) { return Math.max(m, g.version); }, 0) + 1;
  }
  function gameTitle(rec) {
    var d = rec.data;
    var parts = [(d.equipos.visitante.nombre || "Visitante") + " - " + (d.equipos.local.nombre || "Local")];
    if (d.partido.fecha) parts.push(d.partido.fecha);
    if (d.partido.hora) parts.push(d.partido.hora);
    return parts.join(". ") + (rec.version > 1 ? " (v" + rec.version + ")" : "");
  }
  function fileBase(rec) {
    return gameTitle(rec).normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^A-Za-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "partido";
  }
  function fmtDate(ms) {
    try {
      return new Date(ms).toLocaleString("es-ES", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
    } catch (e) { return ""; }
  }
  function newRecord(data, familia, version) {
    var id = uid(), now = Date.now();
    return { id: id, familia: familia || id, version: version || 1, creado: now, modificado: now, data: data };
  }

  function persist() {
    if (!currentRec) return;
    currentRec.modificado = Date.now();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushSave, 250);
  }
  function flushSave() {
    clearTimeout(saveTimer);
    saveTimer = null;
    if (!currentRec) return Promise.resolve();
    return store.put(currentRec).catch(function () {
      if (storageOk) { storageOk = false; toast("No se ha podido guardar en este móvil. Exporta el partido para no perderlo."); }
    });
  }
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") flushSave(); });
  window.addEventListener("pagehide", function () { flushSave(); });

  // ---------- Pantallas ----------
  var homeView = document.getElementById("homeView");
  var listView = document.getElementById("listView");
  var sheetView = document.getElementById("sheetView");
  var listBody = document.getElementById("listBody");
  var listActions = document.getElementById("listActions");
  var fileInput = document.getElementById("fileInput");
  var currentView = "home";
  var listMode = "open";
  var selected = {};

  function showView(name) {
    homeView.hidden = name !== "home";
    listView.hidden = name !== "list";
    sheetView.hidden = name !== "sheet";
    currentView = name;
  }
  function enterLevel(name) {
    if (history.state && history.state.v && history.state.v !== "home") history.replaceState({ v: name }, "");
    else history.pushState({ v: name }, "");
    showView(name);
  }
  function backToHome() {
    if (history.state && history.state.v && history.state.v !== "home") history.back();
    else goHome();
  }
  function goHome() {
    flushSave();
    closePanel();
    if (ed) closeEditor();
    currentRec = null;
    updateHome();
    showView("home");
  }
  window.addEventListener("popstate", function () {
    if (ed) {
      history.pushState({ v: currentView }, "");
      if (ed.hist.length) {
        openMenu({
          title: "¿Descartar los cambios de esta casilla?",
          extras: [{ label: "Seguir anotando", pick: closeMenu }, { label: "Descartar", cls: "danger", pick: closeEditor }],
          noClose: true
        });
      } else closeEditor();
      return;
    }
    if (!overlay.hidden) { history.pushState({ v: currentView }, ""); closePanel(); return; }
    goHome();
  });

  function updateHome() {
    var n = games.length;
    document.getElementById("homeOpenSub").textContent = n === 0 ? "Todavía no hay partidos guardados"
      : n === 1 ? "1 partido guardado en este móvil" : n + " partidos guardados en este móvil";
  }

  function openGame(rec) {
    currentRec = rec;
    state = rec.data;
    active = "visitante";
    views = {};
    closePanel();
    enterLevel("sheet");
    render();
    ensureView();
  }

  // ---------- Listado ----------
  function showList(mode) {
    listMode = mode;
    selected = {};
    document.getElementById("listTitle").textContent = mode === "open" ? "Abrir partido" : "Exportar partido";
    enterLevel("list");
    renderList();
  }
  function renderList() {
    var sorted = games.slice().sort(function (a, b) { return b.modificado - a.modificado; });
    var h = [];
    if (!sorted.length) {
      h.push('<div class="list-empty"><p>Todavía no hay partidos en este móvil.</p>' +
        '<button type="button" class="btn primary" data-new="1">Nuevo partido</button></div>');
    }
    sorted.forEach(function (g) {
      var text = '<span class="game-text"><span class="game-title">' + esc(gameTitle(g)) + '</span>' +
        '<span class="game-sub">Modificado: ' + esc(fmtDate(g.modificado)) + "</span></span>";
      if (listMode === "open") {
        h.push('<div class="game"><button type="button" class="game-main" data-open="' + g.id + '">' + text + "</button>" +
          '<button type="button" class="game-del" data-del="' + g.id + '">Borrar</button></div>');
      } else {
        h.push('<div class="game"><button type="button" class="game-main" data-sel="' + g.id + '" aria-pressed="' + (selected[g.id] ? "true" : "false") + '">' +
          '<span class="check" aria-hidden="true">✓</span>' + text + "</button></div>");
      }
    });
    listBody.innerHTML = h.join("");
    var count = Object.keys(selected).length;
    listActions.hidden = listMode !== "export" || !sorted.length;
    document.getElementById("expJson").disabled = count < 1;
    document.getElementById("expPdf").disabled = count !== 1;
    document.getElementById("listHint").textContent = listMode === "export"
      ? (count ? count + (count === 1 ? " partido marcado" : " partidos marcados") : "Marca los partidos que quieres exportar")
      : "Toca un partido para abrirlo";
  }

  listBody.addEventListener("click", function (e) {
    var b;
    if (e.target.closest("[data-new]")) { createGame(); return; }
    if ((b = e.target.closest("[data-sel]"))) {
      var id = b.getAttribute("data-sel");
      if (selected[id]) delete selected[id]; else selected[id] = true;
      renderList();
      return;
    }
    if ((b = e.target.closest("[data-open]"))) { askOpen(byId(b.getAttribute("data-open"))); return; }
    if ((b = e.target.closest("[data-del]"))) { askDelete(byId(b.getAttribute("data-del"))); }
  });

  function askOpen(rec) {
    if (!rec) return;
    var v = nextVersion(rec.familia);
    openPanel('<p class="panel-title">' + esc(gameTitle(rec)) + '</p><div class="menu-list">' +
      '<button type="button" class="btn primary" data-act="orig">Abrir el original</button>' +
      '<button type="button" class="btn ghost" data-act="copy">Abrir una copia (v' + v + ")</button>" +
      '<button type="button" class="btn ghost" data-act="cancel">Cancelar</button></div>', function (act) {
      if (act === "orig") openGame(rec);
      else if (act === "copy") {
        var copy = newRecord(JSON.parse(JSON.stringify(rec.data)), rec.familia, v);
        games.push(copy);
        store.put(copy);
        openGame(copy);
        toast("Abierta la copia v" + v + ". El original no cambia.");
      } else closePanel();
    });
    openedAt = 0;
  }
  function askDelete(rec) {
    if (!rec) return;
    openPanel('<p class="panel-title">¿Borrar este partido?</p><p class="panel-text">' + esc(gameTitle(rec)) +
      " se borrará de este móvil. No se puede deshacer.</p>" +
      '<div class="panel-actions"><button type="button" class="btn ghost" data-act="cancel">Cancelar</button>' +
      '<button type="button" class="btn danger" data-act="del">Borrar</button></div>', function (act) {
      closePanel();
      if (act !== "del") return;
      store.del(rec.id).then(function () {
        games = games.filter(function (g) { return g.id !== rec.id; });
        renderList();
        toast("Partido borrado.");
      }).catch(function () { toast("No se ha podido borrar."); });
    });
    openedAt = 0;
  }

  function createGame() {
    var rec = newRecord(blankGame());
    games.push(rec);
    store.put(rec);
    openGame(rec);
  }

  // ---------- Exportar ----------
  function download(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    toast("Archivo guardado en Descargas: " + name);
  }
  function shareOrDownload(blob, name) {
    var file = null;
    try { file = new File([blob], name, { type: blob.type }); } catch (e) { file = null; }
    if (file && navigator.canShare && navigator.share) {
      var ok = false;
      try { ok = navigator.canShare({ files: [file] }); } catch (e) { ok = false; }
      if (ok) {
        navigator.share({ files: [file], title: name }).catch(function (err) {
          if (!err || err.name !== "AbortError") download(blob, name);
        });
        return;
      }
    }
    download(blob, name);
  }
  function exportPackage(recs) {
    flushSave();
    var pkg = { formato: "anotacion-softball", version: 1, exportado: new Date().toISOString(), partidos: recs };
    var name = recs.length === 1 ? fileBase(recs[0]) + ".json"
      : "partidos-softball-" + new Date().toISOString().slice(0, 10) + ".json";
    shareOrDownload(new Blob([JSON.stringify(pkg)], { type: "application/json" }), name);
  }
  function printGame(rec) {
    flushSave();
    var saved = state;
    state = rec.data;
    var html = ["visitante", "local"].map(function (t) {
      return '<div class="print-page"><div class="print-sheet">' + sheetHTML(t) + "</div></div>";
    }).join("");
    state = saved;
    var pa = document.getElementById("printArea");
    pa.innerHTML = html;
    pa.classList.add("measure");
    pa.querySelectorAll(".print-page").forEach(function (page) {
      var sh = page.firstChild, w = sh.offsetWidth, h = sh.offsetHeight;
      var z = Math.min(1040 / w, 715 / h, 1);
      page.style.width = Math.ceil(w * z) + "px";
      page.style.height = Math.ceil(h * z) + "px";
      sh.style.transform = "scale(" + z.toFixed(4) + ")";
    });
    pa.classList.remove("measure");
    var oldTitle = document.title;
    document.title = fileBase(rec);
    window.addEventListener("afterprint", function restore() {
      document.title = oldTitle;
      window.removeEventListener("afterprint", restore);
    });
    window.print();
  }
  function exportMenu(rec) {
    openPanel('<p class="panel-title">Exportar ' + esc(gameTitle(rec)) + '</p><div class="menu-list">' +
      '<button type="button" class="btn ghost" data-act="json">Archivo para otro dispositivo (.json)</button>' +
      '<button type="button" class="btn ghost" data-act="pdf">Hoja en PDF</button>' +
      '<button type="button" class="btn ghost" data-act="cancel">Cancelar</button></div>', function (act) {
      closePanel();
      if (act === "json") exportPackage([rec]);
      else if (act === "pdf") printGame(rec);
    });
    openedAt = 0;
  }
  document.getElementById("expJson").addEventListener("click", function () {
    var recs = games.filter(function (g) { return selected[g.id]; });
    if (recs.length) exportPackage(recs);
  });
  document.getElementById("expPdf").addEventListener("click", function () {
    var recs = games.filter(function (g) { return selected[g.id]; });
    if (recs.length === 1) printGame(recs[0]);
  });

  // ---------- Cargar ----------
  fileInput.addEventListener("change", function () {
    var f = fileInput.files && fileInput.files[0];
    fileInput.value = "";
    if (!f) return;
    f.text().then(importText).catch(function () { toast("No se ha podido leer el archivo."); });
  });
  function askConflict(rec, go) {
    openPanel('<p class="panel-title">Este partido ya está en el móvil</p><p class="panel-text">' + esc(gameTitle(rec)) + "</p>" +
      '<div class="menu-list"><button type="button" class="btn ghost" data-act="replace">Reemplazar el del móvil</button>' +
      '<button type="button" class="btn ghost" data-act="copy">Guardar como copia</button>' +
      '<button type="button" class="btn ghost" data-act="skip">Omitir</button></div>', function (act) {
      if (act === "cancel") act = "skip";
      closePanel();
      go(act);
    });
    openedAt = 0;
  }
  function importText(txt) {
    var pkg = null;
    try { pkg = JSON.parse(txt); } catch (e) { pkg = null; }
    var list = pkg && pkg.formato === "anotacion-softball" && Array.isArray(pkg.partidos) ? pkg.partidos : null;
    if (!list) { toast("Este archivo no es un partido de esta app."); return; }
    var valid = list.filter(function (r) { return r && r.id && r.data && isValid(r.data); }).map(function (r) {
      return {
        id: String(r.id), familia: String(r.familia || r.id), version: +r.version || 1,
        creado: +r.creado || Date.now(), modificado: +r.modificado || Date.now(), data: migrate(r.data)
      };
    });
    if (!valid.length) { toast("El archivo no contiene partidos válidos."); return; }
    var added = 0;
    (function next(i) {
      if (i >= valid.length) {
        updateHome();
        toast(added ? (added === 1 ? "1 partido cargado." : added + " partidos cargados.") : "No se ha cargado ningún partido.");
        if (added) showList("open");
        return;
      }
      var r = valid[i];
      function go(how) {
        if (how === "skip") { next(i + 1); return; }
        if (how === "copy") { r.id = uid(); r.version = nextVersion(r.familia); r.modificado = Date.now(); }
        if (how === "replace") games = games.filter(function (g) { return g.id !== r.id; });
        if (games.some(function (g) { return g.familia === r.familia && g.version === r.version && g.id !== r.id; })) {
          r.version = nextVersion(r.familia);
        }
        games.push(r);
        store.put(r).then(function () { added++; next(i + 1); }).catch(function () { toast("No se ha podido guardar un partido."); next(i + 1); });
      }
      if (byId(r.id)) askConflict(r, go); else go("new");
    })(0);
  }

  // ---------- Menú inicial ----------
  document.getElementById("homeNew").addEventListener("click", createGame);
  document.getElementById("homeOpen").addEventListener("click", function () { showList("open"); });
  document.getElementById("homeLoad").addEventListener("click", function () { fileInput.click(); });
  document.getElementById("homeExport").addEventListener("click", function () { showList("export"); });
  document.getElementById("listBack").addEventListener("click", backToHome);
  document.getElementById("appVersion").textContent = "Versión " + APP_VERSION;

  function migrateLegacy() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
    if (!raw) return null;
    var g = null;
    try { g = JSON.parse(raw); } catch (e) { g = null; }
    if (!g || !isValid(g)) return null;
    var rec = newRecord(migrate(g));
    games.push(rec);
    return store.put(rec).then(function () {
      try { localStorage.removeItem(KEY); } catch (e) { /* nada */ }
      toast("Tu partido anterior está guardado en «Abrir partido».");
    });
  }
  function initApp() {
    history.replaceState({ v: "home" }, "");
    showView("home");
    store.all().then(function (list) {
      games = (list || []).filter(function (r) { return r && r.data && isValid(r.data); });
      games.forEach(function (r) { migrate(r.data); });
      return migrateLegacy();
    }).catch(function () { /* sin partidos */ }).then(updateHome);
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register("./sw.js").catch(function () { /* sin modo offline */ });
    }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { /* nada */ });
  }

  // ---------- Inicio ----------
  initApp();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { ensureView(); });
})();
</script>
</body>
</html>
