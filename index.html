<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Scorer</title>
<meta name="theme-color" content="#14211A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Scorer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face { font-family: "Barlow"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/barlow-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow"; font-style: normal; font-weight: 500; font-display: swap; src: url("fonts/barlow-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow"; font-style: normal; font-weight: 600; font-display: swap; src: url("fonts/barlow-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 500; font-display: swap; src: url("fonts/barlow-condensed-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 600; font-display: swap; src: url("fonts/barlow-condensed-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 700; font-display: swap; src: url("fonts/barlow-condensed-latin-700-normal.woff2") format("woff2"); }
:root {
  --chrome-bg: #E4E9E5;
  --chrome-fg: #14211A;
  --chrome-muted: #4D5E54;
  --chrome-line: #B9C4BC;
  --tabs-bg: #D3DBD5;
  --tab-active-bg: #14211A;
  --tab-active-fg: #FFFFFF;
  --overlay: rgba(10, 20, 14, 0.55);
  --panel-bg: #FFFFFF;
  --panel-fg: #14211A;
  --field-bg: #F3F6F4;
  --btn-primary-bg: #000000;
  --btn-primary-fg: #FFFFFF;
  --btn-ghost-bg: #E4E9E5;
  --focus: #1E6FD9;
  /* La hoja es papel: se mantiene blanca y en tinta negra también en modo oscuro */
  --paper: #FFFFFF;
  --ink: #000000;
  --paper-head: #D6D6D6;
  --paper-faint: #8C8C8C;
  --paper-auto: #F1F1F1;
  --out-red: #C8102E;
  --hit-green: #1E8E3E;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chrome-bg: #16201B;
    --chrome-fg: #E7EEE9;
    --chrome-muted: #9FB0A6;
    --chrome-line: #34433B;
    --tabs-bg: #222E28;
    --tab-active-bg: #E7EEE9;
    --tab-active-fg: #16201B;
    --overlay: rgba(0, 0, 0, 0.65);
    --panel-bg: #1F2924;
    --panel-fg: #EEF2EF;
    --field-bg: #2A3630;
    --btn-primary-bg: #EEF2EF;
    --btn-primary-fg: #111A15;
    --btn-ghost-bg: #2C3832;
    --focus: #6EA8FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --chrome-bg: #16201B;
  --chrome-fg: #E7EEE9;
  --chrome-muted: #9FB0A6;
  --chrome-line: #34433B;
  --tabs-bg: #222E28;
  --tab-active-bg: #E7EEE9;
  --tab-active-fg: #16201B;
  --overlay: rgba(0, 0, 0, 0.65);
  --panel-bg: #1F2924;
  --panel-fg: #EEF2EF;
  --field-bg: #2A3630;
  --btn-primary-bg: #EEF2EF;
  --btn-primary-fg: #111A15;
  --btn-ghost-bg: #2C3832;
  --focus: #6EA8FF;
  color-scheme: dark;
}

:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; background: var(--chrome-bg); scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--chrome-bg);
  color: var(--chrome-fg);
  font-family: "Barlow", "Helvetica Neue", Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}

/* Pantallas */
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.view[hidden] { display: none; }
.home {
  flex: 1;
  overflow-y: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 18px;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
}
.home-inner { width: 100%; max-width: 440px; }
.home-logo { display: block; width: 68px; height: 68px; }
.home h1 { margin: 14px 0 2px; font: 700 34px/1.05 "Barlow Condensed", "Arial Narrow", Arial, sans-serif; }
.home-lead { margin: 0 0 22px; font: 400 16px/1.4 "Barlow", Arial, sans-serif; color: var(--chrome-muted); }
.home-btn {
  width: 100%;
  min-height: 70px;
  margin-bottom: 10px;
  padding: 13px 18px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 3px;
  border: 1px solid var(--chrome-line);
  border-radius: 14px;
  background: var(--panel-bg);
  color: var(--panel-fg);
  text-align: left;
}
.home-btn strong { font: 600 19px/1.2 "Barlow", Arial, sans-serif; }
.home-btn span { font: 400 14px/1.3 "Barlow", Arial, sans-serif; color: var(--chrome-muted); }
.home-btn.primary { background: var(--btn-primary-bg); color: var(--btn-primary-fg); border-color: var(--btn-primary-bg); }
.home-btn.primary span { color: inherit; opacity: 0.8; }
.home-foot { margin: 18px 0 0; text-align: center; font: 400 12px "Barlow", Arial, sans-serif; color: var(--chrome-muted); }

.list-head { flex: 1; min-width: 0; }
.list-title { margin: 0; font: 600 19px/1.2 "Barlow", Arial, sans-serif; }
.list-hint { margin: 2px 0 0; font: 400 13px/1.3 "Barlow", Arial, sans-serif; color: var(--chrome-muted); }
.list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 10px;
  padding-left: max(10px, env(safe-area-inset-left, 0px));
  padding-right: max(10px, env(safe-area-inset-right, 0px));
}
.game { display: flex; align-items: stretch; gap: 8px; margin-bottom: 8px; }
.game-main {
  flex: 1;
  min-width: 0;
  min-height: 64px;
  padding: 11px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid var(--chrome-line);
  border-radius: 12px;
  background: var(--panel-bg);
  color: var(--panel-fg);
  text-align: left;
}
.game-text { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.game-title { font: 600 16px/1.3 "Barlow", Arial, sans-serif; overflow-wrap: anywhere; }
.game-sub { font: 400 13px/1.3 "Barlow", Arial, sans-serif; color: var(--chrome-muted); }
.game-del {
  flex: none;
  padding: 0 14px;
  border: 1px solid var(--chrome-line);
  border-radius: 12px;
  background: transparent;
  color: var(--chrome-fg);
  font: 600 14px "Barlow", Arial, sans-serif;
}
.check {
  flex: none;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--chrome-line);
  border-radius: 8px;
  color: transparent;
  font: 700 17px "Barlow", Arial, sans-serif;
}
.game-main[aria-pressed="true"] { border-color: var(--btn-primary-bg); }
.game-main[aria-pressed="true"] .check { background: var(--btn-primary-bg); border-color: var(--btn-primary-bg); color: var(--btn-primary-fg); }
.list-empty { padding: 48px 16px; text-align: center; color: var(--chrome-muted); font: 400 16px/1.4 "Barlow", Arial, sans-serif; }
.list-actions {
  flex: none;
  display: flex;
  gap: 8px;
  padding: 10px;
  border-top: 1px solid var(--chrome-line);
}
.list-actions[hidden] { display: none; }
.list-actions .btn { flex: 1; }

/* Hoja para imprimir o guardar en PDF */
#printArea { display: none; }
#printArea.measure { display: block; position: absolute; left: -30000px; top: 0; }
.print-page { overflow: hidden; }
.print-sheet { width: max-content; background: #FFFFFF; color: #000000; transform-origin: 0 0; }
#printArea td.ab.next { background: none; box-shadow: none; }
#printArea td.ord.next { background: var(--paper-head); }
@media print {
  @page { size: A4 landscape; margin: 8mm; }
  :root { padding: 0; }
  html, body { height: auto; overflow: visible; background: #FFFFFF; }
  body { display: block; }
  body > *:not(#printArea) { display: none !important; }
  #printArea { display: block; position: static; }
  .print-page { break-after: page; page-break-after: always; }
  .print-page:last-child { break-after: auto; page-break-after: auto; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* Barra superior */
.bar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  padding-left: max(10px, env(safe-area-inset-left, 0px));
  padding-right: max(10px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--chrome-line);
}
.tabs {
  flex: 1;
  display: flex;
  gap: 3px;
  padding: 3px;
  border-radius: 12px;
  background: var(--tabs-bg);
  min-width: 0;
}
.tab {
  flex: 1;
  min-width: 0;
  min-height: 46px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--chrome-fg);
  font: 600 18px/1.05 "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2px 6px;
}
.tab[aria-selected="true"] { background: var(--tab-active-bg); color: var(--tab-active-fg); }
.tab-team {
  font: 400 12px/1.2 "Barlow", Arial, sans-serif;
  opacity: 0.85;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tool {
  flex: none;
  min-width: 46px;
  min-height: 46px;
  padding: 0 12px;
  border: 1px solid var(--chrome-line);
  border-radius: 12px;
  background: transparent;
  color: var(--chrome-fg);
  font: 600 15px "Barlow", Arial, sans-serif;
}
.tool.icon { font-size: 22px; padding: 0; }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Lienzo navegable */
#stage {
  flex: 1;
  position: relative;
  overflow: hidden;
  touch-action: none;
}
#paper {
  position: absolute;
  left: 0;
  top: 0;
  width: max-content;
  transform-origin: 0 0;
  will-change: transform;
  background: var(--paper);
  color: var(--ink);
  padding: 22px 22px 26px;
}

/* Hoja */
.game-head {
  display: flex;
  align-items: flex-end;
  gap: 30px;
  margin: 0 4px 16px;
  font: 700 21px "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
}
.hf { display: flex; align-items: flex-end; gap: 8px; }
.hf .line {
  min-height: 32px;
  border-bottom: 2px solid var(--ink);
  padding: 0 6px 2px;
  font: 500 19px "Barlow", Arial, sans-serif;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.team { border: 3px solid var(--ink); border-radius: 8px; overflow: hidden; padding-bottom: 18px; }
.team-head { display: flex; align-items: center; gap: 22px; margin-bottom: 10px; }
.band {
  background: var(--ink);
  color: var(--paper);
  font: 700 42px/1 "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  letter-spacing: 0.04em;
  padding: 10px 34px 8px 22px;
}
.team-name { display: flex; align-items: flex-end; gap: 8px; font: 700 21px "Barlow Condensed", "Arial Narrow", Arial, sans-serif; }
.team-name .line {
  min-height: 32px;
  width: 380px;
  border-bottom: 2px solid var(--ink);
  padding: 0 6px 2px;
  font: 500 19px "Barlow", Arial, sans-serif;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

table { border-collapse: collapse; table-layout: fixed; }
.grid { margin: 0 10px; }
.grid th {
  height: 34px;
  padding: 0;
  border: 1.5px solid var(--ink);
  background: var(--paper-head);
  font: 700 17px "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  text-align: center;
}
.grid td { border: 1.5px solid var(--ink); padding: 0; height: 30px; }
.grid tr.r-top td.split { border-bottom: 1px dashed var(--paper-faint); }
.grid tr.r-sub td.split { border-top: 1px dashed var(--paper-faint); }
.grid td.ord {
  background: var(--paper-head);
  text-align: center;
  font: 700 21px "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
}
.grid td.num, .grid td.pos {
  text-align: center;
  font: 600 17px "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  white-space: nowrap;
  overflow: hidden;
}
.grid td.name {
  padding: 0 8px;
  font: 500 16px "Barlow", Arial, sans-serif;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.grid td.subcell { padding: 0; }
.subwrap { display: flex; height: 29px; }
.subname {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  padding: 0 8px;
  font: 500 15px "Barlow", Arial, sans-serif;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.inn {
  flex: none;
  width: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-left: 1px dashed var(--paper-faint);
  font: 600 14px "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  white-space: nowrap;
}
.ph { color: var(--paper-faint); font-weight: 400; }
.grid td.ab { height: 60px; }
.grid td.ab svg { display: block; width: 100%; height: 58px; }
.grid td.stat { background: var(--paper-auto); text-align: center; font: 600 17px "Barlow Condensed", "Arial Narrow", Arial, sans-serif; }
.grid td.ab.next { background: #FFF1A8; box-shadow: inset 0 0 0 3px #E0B400; }
.grid td.ord.next { background: #FFE066; }
.grid th.inning-cont { font-size: 14px; }

.bottom { display: flex; align-items: flex-start; gap: 26px; margin: 20px 10px 0; }
.mini th, .mini td {
  height: 28px;
  padding: 0 4px;
  border: 1.5px solid var(--ink);
  text-align: center;
  font: 600 15px "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.mini th { background: var(--paper-head); }
.mini th.lead { background: var(--ink); color: var(--paper); text-align: left; font-size: 19px; padding: 0 10px; }
.mini th.title { text-align: left; font-size: 17px; padding: 0 10px; }
.mini td.rowlbl { text-align: left; font-weight: 700; padding-left: 10px; }
.mini td.auto { background: var(--paper-auto); font-size: 16px; }
.mini td.tot { font-weight: 700; }
.mini td.pname { text-align: left; padding-left: 8px; font: 500 14px "Barlow", Arial, sans-serif; }
.fld { cursor: pointer; }

/* Panel de edición */
#overlay {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px 12px;
  background: var(--overlay);
}
#overlay[hidden] { display: none; }
.panel {
  width: 100%;
  max-width: 480px;
  max-height: calc(100% - 12px);
  overflow-y: auto;
  padding: 18px;
  border-radius: 16px;
  background: var(--panel-bg);
  color: var(--panel-fg);
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
}
.panel-title { margin: 0 0 12px; font: 600 18px/1.3 "Barlow", Arial, sans-serif; }
.panel-text { margin: 0 0 6px; font: 400 16px/1.45 "Barlow", Arial, sans-serif; }
.panel input {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--chrome-line);
  border-radius: 10px;
  background: var(--field-bg);
  color: var(--panel-fg);
  font: 500 18px "Barlow", Arial, sans-serif;
  -webkit-user-select: text;
  user-select: text;
}
.panel input:focus { outline: 3px solid var(--focus); outline-offset: 1px; }
.choices { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.choices.cols-4 { grid-template-columns: repeat(4, 1fr); }
.choice {
  min-height: 58px;
  border: 1.5px solid var(--chrome-line);
  border-radius: 10px;
  background: var(--field-bg);
  color: var(--panel-fg);
  font: 700 22px/1 "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 4px 2px;
}
.choice small { font: 400 11px/1.1 "Barlow", Arial, sans-serif; }
.choice[aria-pressed="true"] { background: var(--btn-primary-bg); color: var(--btn-primary-fg); border-color: var(--btn-primary-bg); }
.panel-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
.btn {
  min-height: 48px;
  padding: 0 18px;
  border: 0;
  border-radius: 10px;
  font: 600 17px "Barlow", Arial, sans-serif;
}
.btn.primary { background: var(--btn-primary-bg); color: var(--btn-primary-fg); }
.btn.ghost { background: var(--btn-ghost-bg); color: var(--panel-fg); }
.btn.danger { background: var(--out-red); color: #FFFFFF; }
.btn.push-left { margin-right: auto; }
.menu-list { display: flex; flex-direction: column; gap: 10px; }
.menu-list .btn { width: 100%; text-align: left; }

#toast {
  position: fixed;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  z-index: 30;
  max-width: 90vw;
  padding: 12px 18px;
  border-radius: 12px;
  background: var(--tab-active-bg);
  color: var(--tab-active-fg);
  font: 500 15px/1.35 "Barlow", Arial, sans-serif;
  text-align: center;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, 16px);
  transition: opacity 0.2s, transform 0.2s;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#editor:not([hidden]) ~ #toast { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 64px); }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
.grid th.colhead { cursor: pointer; }

/* Pop-up de la casilla */
#editor {
  position: fixed;
  inset: 0;
  z-index: 25;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px calc(env(safe-area-inset-bottom, 0px) + 12px);
  background: var(--panel-bg);
  color: var(--panel-fg);
}
#editor[hidden] { display: none; }
.ed-top { display: flex; align-items: center; gap: 12px; }
.ed-head { min-width: 0; }
.ed-title { margin: 0; font: 600 19px/1.2 "Barlow", Arial, sans-serif; }
.ed-sub { margin: 2px 0 0; font: 400 14px/1.3 "Barlow", Arial, sans-serif; color: var(--chrome-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ed-main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.ed-main svg { display: block; height: auto; background: var(--paper); border: 2px solid var(--ink); border-radius: 4px; touch-action: manipulation; font-family: "Barlow Condensed", "Arial Narrow", Arial, sans-serif; }
.ed-svg > :not([data-zone]) { pointer-events: none; }
.ed-svg .hz { fill: rgba(0, 0, 0, 0); }
.ed-svg .hb { fill: rgba(0, 0, 0, 0); }
.ed-svg .hl { stroke: rgba(0, 0, 0, 0); stroke-width: 12; stroke-linecap: round; fill: none; }
.ed-svg .hz:active, .ed-svg .hb:active { fill: rgba(30, 111, 217, 0.16); }
.ed-svg .hl:active { stroke: rgba(30, 111, 217, 0.2); }
.ed-svg .guide { stroke: #B5B5B5; stroke-width: 0.6; stroke-dasharray: 2 2; }
.ed-extra { min-height: 52px; display: flex; flex-direction: column; align-items: stretch; gap: 8px; }
.ed-count { margin: 0; text-align: center; font: 400 15px/1.3 "Barlow", Arial, sans-serif; color: var(--chrome-muted); }
.ed-count b { color: var(--panel-fg); font-weight: 600; font-size: 17px; }
.ed-pitch { display: flex; gap: 8px; }
.pbtn { flex: 1; min-height: 52px; border: 0; border-radius: 12px; background: #E6EE3A; color: #14211A; font: 600 18px/1 "Barlow", Arial, sans-serif; touch-action: manipulation; }
.pbtn:active { filter: brightness(0.9); }
.ed-toggles { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.btn.chip { min-height: 40px; padding: 6px 12px; font-size: 14px; }
.btn.wide { width: 100%; margin-top: 10px; }
.form-row { display: flex; gap: 8px; margin-bottom: 4px; }
.form-row input { min-width: 0; }
.form-row input:first-child { flex: 0 0 72px; }
.form-row input:last-child { flex: 1; }

<script>
(function () {
  "use strict";

  // ---------- Datos ----------
  var KEY = "anotacion-softball:partido-actual";
  var STATS = ["AB", "R", "H", "RBI", "BB", "SB", "SF", "SH", "E", "LOB"];
  var POS = {
    1: "Lanzador", 2: "Receptor", 3: "Primera", 4: "Segunda", 5: "Tercera",
    6: "Short", 7: "Jardín izq.", 8: "Jardín cen.", 9: "Jardín der.", 10: "Shortfielder", 11: "Bateador designado"
  };
  // Abreviaturas de las tarjetas de estadísticas
  var POS_ABBR = { 1: "P", 2: "C", 3: "1B", 4: "2B", 5: "3B", 6: "SS", 7: "LF", 8: "CF", 9: "RF", 10: "SF", 11: "DH" };
  function posLbl(k) { return String(k) === "11" ? "DH" : String(k); }
  var PITCH_COLS = [
    { k: "dorsal", h: "#", w: 40, kind: "dorsal", label: "dorsal" },
    { k: "nombre", h: "LANZADOR", w: 170, kind: "text", label: "nombre" },
    { k: "ip", h: "IP", w: 44, kind: "decimal", label: "entradas lanzadas (IP)" },
    { k: "h", h: "H", w: 38, kind: "num", label: "hits (H)" },
    { k: "r", h: "R", w: 38, kind: "num", label: "carreras (R)" },
    { k: "er", h: "ER", w: 40, kind: "num", label: "carreras limpias (ER)" },
    { k: "bb", h: "BB", w: 40, kind: "num", label: "bases por bolas (BB)" },
    { k: "k", h: "K", w: 38, kind: "num", label: "ponches (K)" },
    { k: "hr", h: "HR", w: 40, kind: "num", label: "home runs (HR)" },
    { k: "p", h: "P", w: 40, kind: "num", label: "lanzamientos (P)" }
  ];
  var TEAM_LABEL = { visitante: "Visitante", local: "Local" };
  // Columnas de la tabla de lanzadores que se calculan solas (ER, nombre y dorsal se escriben)
  var AUTO_PITCH = ["ip", "h", "r", "bb", "k", "hr", "p"];

  function blankPlayer() { return { dorsal: "", nombre: "", pos: "", jid: null }; }
  function blankTeam() {
    var lineup = [], lanz = [], cols = [], i;
    for (i = 0; i < 10; i++) {
      var sub = blankPlayer(); sub.inning = "";
      lineup.push({ titular: blankPlayer(), sustituto: sub });

  // ---------- Zoom y desplazamiento ----------
  var views = {};

    var vw = stage.clientWidth, vh = stage.clientHeight;

    v.y = sh <= vh ? 0 : Math.min(0, Math.max(vh - sh, v.y));
  }
  function apply() {
    var v = view();

  }
  function fit() {

    clampPos(v); apply();
  }

  }

    var v = view(), p = pts();

      g.d0 = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1;
      g.m0 = { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 };

      g.p0 = { x: p[0].x, y: p[0].y };

      var m = { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 };
      var s = clampScale(g.t0.s * d / g.d0);

  // ---------- Totales y orden de bateo ----------

    var p = activeAt(slot, n), isSub = p === slot.sustituto, subIn = parseInt(slot.sustituto.inning, 10) || 0;
    var pos = p.pos;
    (slot.cambiosPos || []).forEach(function (ch) {
      var i = parseInt(ch.inning, 10);
      if (i <= n && (!isSub || i >= subIn)) pos = ch.pos;
    });
    return pos;
  }
  function posTrail(slot, who) { return posList(slot, who).map(posLbl).join("·"); }
  function posList(slot, who) {
    var subIn = parseInt(slot.sustituto.inning, 10) || 0, hasSub = !!(slot.sustituto.nombre || slot.sustituto.pos) && subIn;
    var p = who === "sustituto" ? slot.sustituto : slot.titular;
    var list = p.pos ? [p.pos] : [];
    (slot.cambiosPos || []).forEach(function (ch) {
      var i = parseInt(ch.inning, 10);
      if (who === "sustituto" ? (hasSub && i >= subIn) : (!hasSub || i < subIn)) list.push(ch.pos);
    });
    return list;
  }
  // Casillas en el orden en que se jugaron: columna a columna y, dentro de cada una,
  // desde el bateador que abrió la entrada siguiendo el orden de bateo
  function gameOrder(team) {
    var out = [], next = 0, cs = team.casillas, N = nfil(team);
    team.columnas.forEach(function (col, ci) {
      var found = -1;
      for (var s = 0; s < N; s++) {
        var row = (next + s) % N, c = cs[row + ":" + col.id];
        if (c && isPA(c)) found = row;
        else if (found >= 0) break;
      }
      for (var s2 = 0; s2 < N; s2++) {
        var r2 = (next + s2) % N, c2 = cs[r2 + ":" + col.id];
        if (c2) out.push({ row: r2, col: col, ci: ci, c: c2 });
      }
      if (found >= 0) next = (found + 1) % N;
    });
    return out;
  }
  // Diagonal de fin de entrada: en el último turno completado de cada inning cerrado
  function closerCells(team) {
    var closed = closedInnings(team), last = {}, res = {};
    gameOrder(team).forEach(function (o) { if (isPA(o.c) && closed[o.col.n]) last[o.col.n] = o.row + ":" + o.col.id; });
    Object.keys(last).forEach(function (n) { res[last[n]] = true; });
    return res;
  }
  // Estadísticas de los lanzadores del equipo t, sacadas de la hoja del rival
  function pitcherStats(t) { return pitcherStatsD(state, t); }
  function pitcherStatsD(g, t) {
    var team = g.equipos[t], opp = g.equipos[other(t)], nRows = team.lanzadores.length;
    var rows = [], i;
    for (i = 0; i < nRows; i++) rows.push({ outs: 0, h: 0, r: 0, bb: 0, k: 0, hr: 0, p: 0, used: false });
    var order = gameOrder(opp);
    var anyPitch = order.some(function (o) { return hasPitches(o.c); });
    var idx = 0, curN = null, alloc = 0, inningOuts = {};
    order.forEach(function (o) { if (o.c.out) inningOuts[o.col.n] = (inningOuts[o.col.n] || 0) + 1; });
    function endInning() {
      if (curN === null) return;
      rows[idx].outs += Math.max(0, Math.min(3, inningOuts[curN] || 0) - alloc);
    }
    order.forEach(function (o) {
      var c = o.c, r;
      if (o.col.n !== curN) { endInning(); curN = o.col.n; alloc = 0; }
      r = rows[idx]; r.used = true;
      var bp = c.batter.play, op = c.outPlay, pc = pitchesOf(c);
      if (bp && (bp.code === "H" || bp.code === "HR")) r.h++;
      if (bp && bp.code === "HR") r.hr++;
      if (bp && (bp.code === "BB" || bp.code === "iBB")) r.bb++;
      if ((!reachedBase(c) && op && (op.code === "K" || op.code === "Kc")) || (bp && bp.k3)) r.k++;
      if (scored(c)) r.r++;
      r.p += pc.b + pc.s + pc.f;
      if (isPA(c) && !(bp && bp.code === "iBB")) r.p++;
      if (c.cambioLanz) {
        var o2 = Math.max(alloc, Math.min(3, c.cambioLanz.outs || 0));
        r.outs += o2 - alloc; alloc = o2;
        if (idx < nRows - 1) idx++;
        rows[idx].used = true;
      }
    });
    endInning();
    return rows.map(function (r) {
      if (!r.used || !order.length) return null;
      return { outs: r.outs, ip: Math.floor(r.outs / 3) + "." + (r.outs % 3), h: r.h, r: r.r, bb: r.bb, k: r.k, hr: r.hr, p: anyPitch ? r.p : "" };
    });
  }
  function closedInnings(team) {
    var map = colById(team), closed = {};
    Object.keys(team.casillas).forEach(function (k) {
      var c = team.casillas[k], col = map[k.split(":")[1]];
      if (col && c.out === 3) closed[col.col.n] = true;
    });
    return closed;
  }

  function computeStats(t) {
    var team = state.equipos[t], map = colById(team);
    var rows = [], innings = {}, i;
    for (i = 0; i < 10; i++) rows.push({ AB: 0, R: 0, H: 0, RBI: 0, BB: 0, SB: 0, SF: 0, SH: 0, E: 0, LOB: 0, any: false });
    team.columnas.forEach(function (c) { if (!innings[c.n]) innings[c.n] = { R: 0, H: 0, LOB: 0, any: false }; });

    Object.keys(team.casillas).forEach(function (k) {
      var parts = k.split(":"), row = +parts[0], col = map[parts[1]], c = team.casillas[k];
      if (!col || !rows[row]) return;
      var r = rows[row], inn = innings[col.col.n];
      r.any = true; inn.any = true;
      if (isAB(c)) r.AB++;
      if (scored(c)) { r.R++; inn.R++; }
      var bp = c.batter.play;
      if (bp && (bp.code === "H" || bp.code === "HR")) { r.H++; inn.H++; }
      r.RBI += c.batter.rbi || 0;
      if (bp && (bp.code === "BB" || bp.code === "iBB")) r.BB++;
      c.runners.forEach(function (rr) { if (rr.play === "SB") r.SB++; });
      if (c.outPlay && c.outPlay.code === "SF") r.SF++;
      if (c.outPlay && c.outPlay.code === "SH") r.SH++;
      if (isLOB(c)) { r.LOB++; inn.LOB++; }
    });

    // Errores cometidos: E# anotados en la hoja del rival, asignados por posición
    var opp = state.equipos[other(t)], omap = colById(opp);
    Object.keys(opp.casillas).forEach(function (k) {
      var col = omap[k.split(":")[1]], c = opp.casillas[k];
      if (!col) return;
      var n = col.col.n, positions = [];
      if (c.batter.play && c.batter.play.code === "E") positions.push(c.batter.play.n);
      c.runners.forEach(function (rr) { if (rr.play === "E" && rr.e) positions.push(rr.e); });
      positions.forEach(function (p) {
        for (var j = 0; j < 10; j++) {
          if (String(posAt(team.lineup[j], n)) === String(p)) { rows[j].E++; rows[j].any = true; break; }
        }
      });
    });

    return { rows: rows, innings: innings, next: nextBatter(team, map) };
  }

  // Siguiente bateador: se recorren las columnas en orden y, dentro de cada una,
  // los turnos a partir de donde terminó la anterior (el orden da la vuelta del 10 al 1)
  function nextBatter(team, map) {
    var next = 0, lastCol = -1, cs = team.casillas, cols = team.columnas, N = nfil(team);
    cols.forEach(function (col, ci) {
      var found = -1;
      for (var s = 0; s < N; s++) {
        var row = (next + s) % N, c = cs[row + ":" + col.id];
        if (c && isPA(c)) found = row;
        else if (found >= 0) break;
      }
      if (found >= 0) { next = (found + 1) % N; lastCol = ci; }
    });
    if (lastCol < 0) return { row: 0, colId: cols[0] ? cols[0].id : null };
    var closed = closedInnings(team), cur = cols[lastCol];
    if (!closed[cur.n]) return { row: next, colId: cur.id };
    for (var ci = lastCol + 1; ci < cols.length; ci++) {
      if (cols[ci].n > cur.n && !cols[ci].cont) return { row: next, colId: cols[ci].id };
    }
    return { row: next, colId: null };
  }

  // ---------- Columnas de inning ----------
  function maxInning() {
    var all = state.equipos.visitante.columnas.concat(state.equipos.local.columnas);
    return Math.max.apply(null, all.map(function (c) { return c.n; }));
  }
  function colHasData(t, id) {
    return Object.keys(state.equipos[t].casillas).some(function (k) { return k.split(":")[1] === id; });
  }
  function afterColumnsChange(msg) { persist(); render(); ensureView(); if (msg) toast(msg); }
  function addExtraInning() {
    var n = maxInning() + 1;
    ["visitante", "local"].forEach(function (t) { state.equipos[t].columnas.push({ id: "c" + n, n: n, cont: false }); });
    afterColumnsChange("Inning " + n + " añadido a los dos equipos.");
  }
  function addCont(t, id) {
    var cols = state.equipos[t].columnas;
    var i = cols.findIndex(function (c) { return c.id === id; });
    var c = cols[i];
    cols.splice(i + 1, 0, { id: "c" + c.n + "x" + newId(), n: c.n, cont: true });
    afterColumnsChange("Columna «" + c.n + " cont» añadida.");
  }
  function removable(t, col) {
    if (col.cont) return colHasData(t, col.id) ? "Para quitar esta columna, vacía antes sus casillas." : true;
    if (col.n <= 7) return "";
    if (col.n !== maxInning()) return "Solo se puede quitar el último inning extra.";
    var blocked = ["visitante", "local"].some(function (tt) {
      return colHasData(tt, col.id) || state.equipos[tt].columnas.some(function (c) { return c.cont && c.n === col.n; });
    });
    return blocked ? "Para quitar este inning, vacía antes sus casillas y sus columnas «cont» en los dos equipos." : true;
  }
  function removeColumn(t, col) {
    (col.cont ? [t] : ["visitante", "local"]).forEach(function (tt) {
      var cs = state.equipos[tt].columnas;
      var i = cs.findIndex(function (c) { return c.id === col.id; });
      if (i >= 0) cs.splice(i, 1);

    afterColumnsChange("Columna quitada.");
  }
  function openColumnMenu(id) {

    var next = cols[idx + 1];

    if (!col.cont && !(next && next.cont && next.n === col.n)) {
      html += '<button type="button" class="btn ghost" data-act="cont">Añadir «' + col.n + ' cont» a la derecha (bateo de vuelta)</button>';
    }
    html += '<button type="button" class="btn ghost" data-act="extra">Añadir inning extra (' + (maxInning() + 1) + ") a los dos equipos</button>";
    var why = removable(t, col);
    if (why === true) html += '<button type="button" class="btn danger" data-act="remove">Quitar esta columna</button>';
    else if (why) html += '<p class="panel-text">' + esc(why) + "</p>";
    html += '<button type="button" class="btn ghost" data-act="cancel">Cerrar</button></div>';
    openPanel(html, function (act) {

  // ---------- Pop-up de la casilla ----------

  function openEditor(t, row, colId) {

  // ---------- Lanzamientos ----------
  function pitch(k) {

    change(function (d) {
      var p = d.pitches;

  }
  function countMenu() {

    function row(label, field, max) {
      var a = [];
      for (var v = 0; v <= max; v++) (function (v) { a.push({ label: String(v), sub: label, pressed: pc[field] === v, pick: function () { set(field, v); } }); })(v);

  }
  function outsInInning() {
    var sameInning = {}, n = 0;

    var cs = state.equipos[ed.t].casillas;
    Object.keys(cs).forEach(function (k) {
      var p = k.split(":");
      if (sameInning[p[1]] && !(+p[0] === ed.row && p[1] === ed.col.id) && cs[k].out) n++;

      }),
      extras: cur ? [{ label: "Quitar cambio", pick: function () { change(function (d) { d.cambioLanz = null; }); closeMenu(); } }] : []
    });

  function zoneTap(z) {
    if (z.indexOf("line") === 0) {
      var i = +z.slice(4);
      change(function (d) { d.lines[i] = (d.lines[i] + 1) % 3; });
      var st = ed.draft.lines[i];
      toast(st === 1 ? (ed.draft.lines.every(function (v) { return v === 1; }) ? "Carrera anotada." : "Tramo " + TRAMO[i] + " completado.")
        : st === 2 ? "Out en el tramo " + TRAMO[i] + "." : "Tramo " + TRAMO[i] + " borrado.");
      return;
    }
    if (z.indexOf("base") === 0) {
      var k = +z.slice(4) - 1;
      change(function (d) { d.effort[k] = !d.effort[k]; });

    }

  }

  // ---------- Menús del pop-up ----------
  function openMenu(o) {
    menuState = o;

  function fieldSVG(dir) {

    // Franja de home run, detrás de la valla
    s += '<path d="M8.6 93.6 A200 200 0 0 1 291.4 93.6 L311.2 73.8 A228 228 0 0 0 -11.2 73.8 Z" fill="#F3DCCF" stroke="#8B3B18" stroke-width="1"/>';

    s += '<path d="M150 235 L8.6 93.6 A200 200 0 0 1 291.4 93.6 Z" fill="#E4EFE6"/>';
    s += '<path d="M150 235 L105 190 L150 145 L195 190 Z" fill="#EADBC4" stroke="#000" stroke-width="1.2"/>';
    s += '<path d="M150 235 L8.6 93.6 M150 235 L291.4 93.6" stroke="#000" stroke-width="1.5" fill="none"/>';
    s += '<path d="M8.6 93.6 A200 200 0 0 1 291.4 93.6" stroke="#000" stroke-width="3" fill="none"/>';
    if (dir) {
      var len = Math.min(dir.r, 1.15) * 200;
      s += arrowSVG(150, 235, 150 + Math.sin(dir.a) * len, 235 - Math.cos(dir.a) * len, "#1E8E3E", 3, 12);
    }
    return s + "</svg>";

        closeMenu();

    });

  // ---------- Partidos guardados en el móvil ----------
  var APP_VERSION = "6.0";
  var store = (function () {
    var dbp = null, useLS = false, LSK = "anotacion-softball:partidos";
    function idb() {
      if (!dbp) {
        dbp = new Promise(function (res, rej) {
          if (!window.indexedDB) { rej(new Error("sin almacén")); return; }
          var rq = indexedDB.open("anotacion-softball", 2);
          rq.onupgradeneeded = function () {
            var d = rq.result;
            ["partidos", "jugadores", "equipos"].forEach(function (n) { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: "id" }); });
          };
          rq.onsuccess = function () { res(rq.result); };
          rq.onerror = function () { rej(rq.error); };
        });
      }
      return dbp;
    }
    function tx(mode, fn, name) {
      return idb().then(function (db) {
        return new Promise(function (res, rej) {
          var t = db.transaction(name || "partidos", mode), rq = fn(t.objectStore(name || "partidos"));
          t.oncomplete = function () { res(rq ? rq.result : undefined); };
          t.onerror = function () { rej(t.error); };
          t.onabort = function () { rej(t.error); };
        });
      });
    }
    function lsAll() { try { return JSON.parse(localStorage.getItem(LSK) || "{}"); } catch (e) { return {}; } }
    function lsGet(n) { try { return JSON.parse(localStorage.getItem("anotacion-softball:" + n) || "{}"); } catch (e) { return {}; } }
    function lsSet(n, m) { localStorage.setItem("anotacion-softball:" + n, JSON.stringify(m)); }
    return {
      allOf: function (n) {
        if (useLS) { var m = lsGet(n); return Promise.resolve(Object.keys(m).map(function (k) { return m[k]; })); }
        return tx("readonly", function (s) { return s.getAll(); }, n).catch(function () {
          useLS = true;
          var m = lsGet(n);
          return Object.keys(m).map(function (k) { return m[k]; });
        });
      },
      putIn: function (n, rec) {
        if (useLS) { var m = lsGet(n); m[rec.id] = rec; lsSet(n, m); return Promise.resolve(); }
        return tx("readwrite", function (s) { return s.put(rec); }, n);
      },
      delIn: function (n, id) {
        if (useLS) { var m = lsGet(n); delete m[id]; lsSet(n, m); return Promise.resolve(); }
        return tx("readwrite", function (s) { return s.delete(id); }, n);
      },
      all: function () {
        return tx("readonly", function (s) { return s.getAll(); }).catch(function () {
          useLS = true;
          var m = lsAll();
          return Object.keys(m).map(function (k) { return m[k]; });
        });
      },
      put: function (rec) {
        if (useLS) { var m = lsAll(); m[rec.id] = rec; localStorage.setItem(LSK, JSON.stringify(m)); return Promise.resolve(); }
        return tx("readwrite", function (s) { return s.put(rec); });
      },
      del: function (id) {
        if (useLS) { var m = lsAll(); delete m[id]; localStorage.setItem(LSK, JSON.stringify(m)); return Promise.resolve(); }
        return tx("readwrite", function (s) { return s.delete(id); });
      }
    };
  })();

  function byId(id) { return games.find(function (g) { return g.id === id; }); }
  function nextVersion(fam) {
    return games.filter(function (g) { return g.familia === fam; }).reduce(function (m, g) { return Math.max(m, g.version); }, 0) + 1;
  }
  function gameTitle(rec) {
    var d = rec.data;
    var parts = [(d.equipos.visitante.nombre || "Visitante") + " - " + (d.equipos.local.nombre || "Local")];
    if (d.partido.fecha) parts.push(d.partido.fecha);
    if (d.partido.hora) parts.push(d.partido.hora);
    return parts.join(". ") + (rec.version > 1 ? " (v" + rec.version + ")" : "");
  }
  function fileBase(rec) {
    return gameTitle(rec).normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^A-Za-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "partido";
  }
  function fmtDate(ms) {
    try {
      return new Date(ms).toLocaleString("es-ES", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
    } catch (e) { return ""; }
  }
  function newRecord(data, familia, version) {
    var id = uid(), now = Date.now();
    return { id: id, familia: familia || id, version: version || 1, creado: now, modificado: now, data: data };
  }

  function persist() {
    if (!currentRec) return;

    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushSave, 250);
  }
  function flushSave() {
    clearTimeout(saveTimer);
    saveTimer = null;
    if (!currentRec) return Promise.resolve();
    try { buildTurnos(currentRec.data); } catch (err) { /* el turno se recalcula al abrir las estadísticas */ }
    return store.put(currentRec).catch(function () {
      if (storageOk) { storageOk = false; toast("No se ha podido guardar en este móvil. Exporta el partido para no perderlo."); }
    });
  }

  window.addEventListener("pagehide", function () { flushSave(); });

  // ---------- Pantallas ----------

  var fileInput = document.getElementById("fileInput");

  function enterLevel(name) {

  window.addEventListener("popstate", function () {

  function updateHome() {

  // ---------- Listado ----------
  function showList(mode) {

  function renderList() {
    var sorted = games.slice().sort(function (a, b) { return b.modificado - a.modificado; });
    var h = [];
    if (!sorted.length) {
      h.push('<div class="list-empty"><p>Todavía no hay partidos en este móvil.</p>' +

      if (listMode === "open") {
        h.push('<div class="game"><button type="button" class="game-main" data-open="' + g.id + '">' + text + "</button>" +
          '<button type="button" class="game-del" data-del="' + g.id + '">Borrar</button></div>');
      } else {

  listBody.addEventListener("click", function (e) {

  function askOpen(rec) {
    if (!rec) return;
    var v = nextVersion(rec.familia);
    openPanel('<p class="panel-title">' + esc(gameTitle(rec)) + '</p><div class="menu-list">' +
      '<button type="button" class="btn primary" data-act="orig">Abrir el original</button>' +
      '<button type="button" class="btn ghost" data-act="copy">Abrir una copia (v' + v + ")</button>" +
      '<button type="button" class="btn ghost" data-act="cancel">Cancelar</button></div>', function (act) {
      if (act === "orig") openGame(rec);
      else if (act === "copy") {
        var copy = newRecord(JSON.parse(JSON.stringify(rec.data)), rec.familia, v);
        games.push(copy);
        store.put(copy);
        openGame(copy);
        toast("Abierta la copia v" + v + ". El original no cambia.");
      } else closePanel();
    });
    openedAt = 0;
  }
  function askDelete(rec) {
    if (!rec) return;
    openPanel('<p class="panel-title">¿Borrar este partido?</p><p class="panel-text">' + esc(gameTitle(rec)) +
      " se borrará de este móvil. No se puede deshacer.</p>" +
      '<div class="panel-actions"><button type="button" class="btn ghost" data-act="cancel">Cancelar</button>' +
      '<button type="button" class="btn danger" data-act="del">Borrar</button></div>', function (act) {
      closePanel();
      if (act !== "del") return;
      store.del(rec.id).then(function () {
        games = games.filter(function (g) { return g.id !== rec.id; });
        renderList();
        toast("Partido borrado.");
      }).catch(function () { toast("No se ha podido borrar."); });
    });
    openedAt = 0;
  }

  function createGame() {
    var rec = newRecord(blankGame());
    games.push(rec);
    store.put(rec);
    openGame(rec);
  }

  // ---------- Exportar ----------
  function download(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    toast("Archivo guardado en Descargas: " + name);
  }
  function shareOrDownload(blob, name) {
    var file = null;
    try { file = new File([blob], name, { type: blob.type }); } catch (e) { file = null; }
    if (file && navigator.canShare && navigator.share) {
      var ok = false;
      try { ok = navigator.canShare({ files: [file] }); } catch (e) { ok = false; }
      if (ok) {
        navigator.share({ files: [file], title: name }).catch(function (err) {
          if (!err || err.name !== "AbortError") download(blob, name);
        });
        return;
      }
    }
    download(blob, name);
  }
  function exportPackage(recs) {
    flushSave();
    var pkg = { formato: "anotacion-softball", version: 1, exportado: new Date().toISOString(), partidos: recs };
    var name = recs.length === 1 ? fileBase(recs[0]) + ".json"
      : "partidos-softball-" + new Date().toISOString().slice(0, 10) + ".json";
    shareOrDownload(new Blob([JSON.stringify(pkg)], { type: "application/json" }), name);
  }
  function printGame(rec) {
    flushSave();
    var saved = state;
    state = rec.data;
    var html = ["visitante", "local"].map(function (t) {
      return '<div class="print-page"><div class="print-sheet">' + sheetHTML(t) + "</div></div>";
    }).join("");
    state = saved;
    var pa = document.getElementById("printArea");
    pa.innerHTML = html;
    pa.classList.add("measure");
    pa.querySelectorAll(".print-page").forEach(function (page) {
      var sh = page.firstChild, w = sh.offsetWidth, h = sh.offsetHeight;
      var z = Math.min(1040 / w, 715 / h, 1);
      page.style.width = Math.ceil(w * z) + "px";
      page.style.height = Math.ceil(h * z) + "px";
      sh.style.transform = "scale(" + z.toFixed(4) + ")";
    });
    pa.classList.remove("measure");
    var oldTitle = document.title;
    document.title = fileBase(rec);
    window.addEventListener("afterprint", function restore() {
      document.title = oldTitle;
      window.removeEventListener("afterprint", restore);
    });
    window.print();
  }
  function exportMenu(rec) {
    openPanel('<p class="panel-title">Exportar ' + esc(gameTitle(rec)) + '</p><div class="menu-list">' +
      '<button type="button" class="btn ghost" data-act="json">Archivo para otro dispositivo (.json)</button>' +
      '<button type="button" class="btn ghost" data-act="pdf">Hoja en PDF</button>' +
      '<button type="button" class="btn ghost" data-act="cancel">Cancelar</button></div>', function (act) {
      closePanel();
      if (act === "json") exportPackage([rec]);
      else if (act === "pdf") printGame(rec);
    });
    openedAt = 0;
  }
  document.getElementById("expJson").addEventListener("click", function () {
    var recs = games.filter(function (g) { return selected[g.id]; });
    if (recs.length) exportPackage(recs);
  });
  document.getElementById("expPdf").addEventListener("click", function () {
    var recs = games.filter(function (g) { return selected[g.id]; });
    if (recs.length === 1) printGame(recs[0]);
  });

  // ---------- Cargar ----------
  fileInput.addEventListener("change", function () {
    var f = fileInput.files && fileInput.files[0];
    fileInput.value = "";
    if (!f) return;
    f.text().then(importText).catch(function () { toast("No se ha podido leer el archivo."); });
  });
  function askConflict(rec, go) {
    openPanel('<p class="panel-title">Este partido ya está en el móvil</p><p class="panel-text">' + esc(gameTitle(rec)) + "</p>" +
      '<div class="menu-list"><button type="button" class="btn ghost" data-act="replace">Reemplazar el del móvil</button>' +
      '<button type="button" class="btn ghost" data-act="copy">Guardar como copia</button>' +
      '<button type="button" class="btn ghost" data-act="skip">Omitir</button></div>', function (act) {
      if (act === "cancel") act = "skip";
      closePanel();
      go(act);
    });
    openedAt = 0;
  }
  function importText(txt) {
    var pkg = null;
    try { pkg = JSON.parse(txt); } catch (e) { pkg = null; }
    var list = pkg && pkg.formato === "anotacion-softball" && Array.isArray(pkg.partidos) ? pkg.partidos : null;
    if (!list) { toast("Este archivo no es un partido de esta app."); return; }
    var valid = list.filter(function (r) { return r && r.id && r.data && isValid(r.data); }).map(function (r) {
      return {
        id: String(r.id), familia: String(r.familia || r.id), version: +r.version || 1,
        creado: +r.creado || Date.now(), modificado: +r.modificado || Date.now(), data: migrate(r.data)
      };
    });
    if (!valid.length) { toast("El archivo no contiene partidos válidos."); return; }
    var added = 0;
    (function next(i) {
      if (i >= valid.length) {
        updateHome();
        toast(added ? (added === 1 ? "1 partido cargado." : added + " partidos cargados.") : "No se ha cargado ningún partido.");
        if (added) showList("open");
        return;
      }
      var r = valid[i];
      function go(how) {
        if (how === "skip") { next(i + 1); return; }
        if (how === "copy") { r.id = uid(); r.version = nextVersion(r.familia); r.modificado = Date.now(); }
        if (how === "replace") games = games.filter(function (g) { return g.id !== r.id; });
        if (games.some(function (g) { return g.familia === r.familia && g.version === r.version && g.id !== r.id; })) {
          r.version = nextVersion(r.familia);
        }
        games.push(r);
        store.put(r).then(function () { added++; next(i + 1); }).catch(function () { toast("No se ha podido guardar un partido."); next(i + 1); });
      }
      if (byId(r.id)) askConflict(r, go); else go("new");
    })(0);
  }

  // ---------- Quién batea y quién corre en cada casilla ----------
  function colIndexOf(team, colId) {
    for (var i = 0; i < team.columnas.length; i++) if (team.columnas[i].id === colId) return i;
    return -1;
  }
  function whoAt(t, row, colId) { return whoAtD(state, t, row, colId); }
  function whoAtD(g, t, row, colId) {
    var team = g.equipos[t], slot = team.lineup[row], sub = slot.sustituto, tit = slot.titular;
    if (!(sub.nombre || sub.jid)) return { bat: tit, run: tit };
    var ci = colIndexOf(team, colId), di = sub.desde ? colIndexOf(team, sub.desde) : -1;
    if (di >= 0) {
      if (ci > di) return { bat: sub, run: sub };
      if (ci === di && sub.tipo === "corredor") return { bat: tit, run: sub };
      return { bat: tit, run: tit };
    }
    // Partidos sin casilla de cambio: como en la v5.0, por inning
    var col = team.columnas[ci], entra = parseInt(sub.inning, 10);
    var p = col && entra && entra <= col.n ? sub : tit;
    return { bat: p, run: p };
  }
  // ---------- Directorio de jugadores y equipos ----------
  // Un jugador es un nombre y un dorsal dentro de un equipo. En un mismo equipo
  // no puede haber dos jugadores con el mismo dorsal.
  // Preparado para temporadas: cada ficha y cada partido llevan «temporada», y
  // cada jugador un campo «persona» (vacío) para enlazar en el futuro la misma
  // persona entre temporadas o equipos.
  var TEMPORADA = "T1";
  var dir = { jug: {}, eq: {} };
  var dirBody = document.getElementById("dirBody");
  function normName(s) {
    return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
  }
  function sameName(a, b) { return normName(a) === normName(b); }
  function byName(a, b) { return a.nombre.localeCompare(b.nombre, "es"); }
  function byDorsal(a, b) {
    var x = parseInt(a.dorsal, 10), y = parseInt(b.dorsal, 10);
    if (isNaN(x) && isNaN(y)) return byName(a, b);
    if (isNaN(x)) return 1;
    if (isNaN(y)) return -1;
    return x - y || byName(a, b);
  }
  function dirList(kind) { var m = dir[kind]; return Object.keys(m).map(function (k) { return m[k]; }); }
  function saveJug(j) { dir.jug[j.id] = j; store.putIn("jugadores", j).catch(function () { /* sin almacén */ }); }
  function saveEq(e) { dir.eq[e.id] = e; store.putIn("equipos", e).catch(function () { /* sin almacén */ }); }
  function delJug(id) { delete dir.jug[id]; store.delIn("jugadores", id).catch(function () { /* sin almacén */ }); }
  function delEq(id) { delete dir.eq[id]; store.delIn("equipos", id).catch(function () { /* sin almacén */ }); }
  function newJug(nombre, dorsal, pos, eid) {
    var j = { id: "j" + uid(), nombre: nombre, dorsal: dorsal || "", pos: pos || "", eid: eid || null, temporada: TEMPORADA, persona: null, creado: Date.now() };
    saveJug(j);
    if (eid) addToPlantilla(eid, j.id);
    return j;
  }
  function newEq(nombre) {
    var e = { id: "e" + uid(), nombre: nombre, plantilla: [], temporada: TEMPORADA, creado: Date.now() };
    saveEq(e);
    return e;
  }
  function addToPlantilla(eid, jid) {
    var e = dir.eq[eid];
    if (!e || !jid || e.plantilla.indexOf(jid) >= 0) return;
    e.plantilla.push(jid);
    saveEq(e);
  }
  function plantillaOf(e) { return e.plantilla.map(function (id) { return dir.jug[id]; }).filter(Boolean); }
  function dorsalOwner(e, dorsal, exceptId) {
    if (!dorsal) return null;
    return plantillaOf(e).filter(function (j) { return j.id !== exceptId && String(j.dorsal) === String(dorsal); })[0] || null;
  }

  // Personas anotadas en un lado del partido: line-up (titular y sustituto) y lanzadores
  function sideHolders(data, t) {
    var tm = data.equipos[t], out = [];
    for (var j = 0; j < 10; j++) {
      out.push({ h: tm.lineup[j].titular, lanz: false, row: j });
      out.push({ h: tm.lineup[j].sustituto, lanz: false, row: j });
    }
    tm.lanzadores.forEach(function (l, i) { out.push({ h: l, lanz: true, row: i }); });
    return out;
  }
  function jidUsedElsewhere(jid, holder) {
    var used = games.some(function (r) {
      if (r === currentRec) return false;
      return ["visitante", "local"].some(function (t) { return sideHolders(r.data, t).some(function (x) { return x.h.jid === jid; }); });
    });
    return used || ["visitante", "local"].some(function (t) { return sideHolders(state, t).some(function (x) { return x.h !== holder && x.h.jid === jid; }); });
  }
  // Enlaza (o crea) la ficha de quien se anota en la hoja. Devuelve { ok, msg }.
  function resolvePlayer(t, holder, dorsal, nombre, lanz) {
    var d = String(dorsal || "").trim(), n = String(nombre || "").trim().replace(/\s+/g, " ");
    if (!n) {
      if (d) return { ok: false, msg: "Escribe el nombre del jugador." };
      holder.nombre = ""; holder.dorsal = ""; holder.jid = null;
      return { ok: true };
    }
    var team = state.equipos[t], err = null;
    if (d) {
      sideHolders(state, t).forEach(function (x) {
        if (err || x.h === holder || !x.h.nombre || String(x.h.dorsal) !== d) return;
        if (!sameName(x.h.nombre, n)) err = "El #" + d + " ya lo lleva " + x.h.nombre + " en este partido. Dos jugadores del mismo equipo no pueden tener el mismo número.";
        else if (!x.lanz && !lanz) err = n + " (#" + d + ") ya está en el line-up, en el " + (x.row + 1) + ".º bate.";
      });
      if (err) return { ok: false, msg: err };
    }
    var e = team.eid && dir.eq[team.eid], j = null, created = false;
    if (!e) { holder.jid = null; holder.nombre = n; holder.dorsal = d; return { ok: true }; }
    var plant = plantillaOf(e);
    if (d) {
      var own = dorsalOwner(e, d);
      if (own && !sameName(own.nombre, n)) {
        return { ok: false, msg: "En " + e.nombre + ", el #" + d + " es " + own.nombre + ". Cambia el número o, si ha cambiado de dorsal, corrígelo antes en Jugadores y equipos." };
      }
      j = own || plant.filter(function (x) { return !x.dorsal && sameName(x.nombre, n); })[0] || null;
    } else {
      var same = plant.filter(function (x) { return sameName(x.nombre, n); });
      if (same.length === 1) j = same[0];
    }
    // Corrección de una ficha que solo se ha usado en esta casilla de la hoja
    if (!j && holder.jid && dir.jug[holder.jid] && dir.jug[holder.jid].eid === e.id && !jidUsedElsewhere(holder.jid, holder)) {
      j = dir.jug[holder.jid]; j.nombre = n; j.dorsal = d; saveJug(j);
    }
    if (!j) { j = newJug(n, d, lanz ? "1" : holder.pos, e.id); created = true; }
    if (d && !j.dorsal) { j.dorsal = d; saveJug(j); }
    holder.jid = j.id; holder.nombre = j.nombre; holder.dorsal = d || j.dorsal || "";
    if (!lanz && !holder.pos && j.pos) holder.pos = j.pos;
    return { ok: true, created: created, j: j };
  }
  function linkTeam(t, name) {
    var team = state.equipos[t];
    name = String(name || "").trim();
    if (!name) { team.nombre = ""; team.eid = null; return null; }
    var e = dirList("eq").filter(function (x) { return sameName(x.nombre, name); })[0], created = false;
    if (!e) { e = newEq(name); created = true; }
    team.eid = e.id;
    team.nombre = e.nombre;
    var bad = [];
    sideHolders(state, t).forEach(function (x) {
      if (!x.h.nombre) return;
      var r = resolvePlayer(t, x.h, x.h.dorsal, x.h.nombre, x.lanz);
      if (!r.ok) { x.h.jid = null; bad.push(x.h.nombre); }
    });
    return { e: e, created: created, bad: bad };
  }
  // Aprende la posición habitual si la ficha aún no la tiene
  function learnHabit(path, value) {
    var m = /^(equipos\.(?:visitante|local)\.lineup\.\d+\.(?:titular|sustituto))\.pos$/.exec(path);
    if (!m || !value) return;
    var holder = getPath(m[1]), j = holder && holder.jid && dir.jug[holder.jid];
    if (j && !j.pos) { j.pos = value; saveJug(j); }
  }

  // Copiar el line-up del último partido del equipo
  function lastLineup(eid) {
    var best = null;
    games.forEach(function (g) {

        var e = g.data.equipos[t];

  function usageOf(kind, id) {
    var fin = 0, open = 0;
    games.forEach(function (r) {
      if (!hasCells(r.data)) return;
      var hit = ["visitante", "local"].some(function (t) {
        return kind === "eq" ? r.data.equipos[t].eid === id : sideHolders(r.data, t).some(function (x) { return x.h.jid === id; });
      });
      if (hit) { if (r.data.terminado) fin++; else open++; }
    });
    return { fin: fin, open: open, total: fin + open };
  }
  function usageText(u, who) {

    if (u.open) parts.push(u.open + (u.open === 1 ? " partido sin terminar" : " partidos sin terminar"));
    return who + " ha jugado en " + parts.join(" y ") + "." + (u.open ? " Los partidos sin terminar se pueden seguir anotando, pero su nombre ya no se podrá corregir desde aquí." : "") +

  // ---------- Jugadas como datos con significado (anexo A1) ----------
  var RES_HIT = { 1: "1B", 2: "2B", 3: "3B" };
  var RES_BAT = { HR: "HR", BB: "BB", iBB: "IBB", HbP: "HBP", FC: "FC", E: "E", WP: "K3", PB: "K3" };
  function personOf(p) { return p && (p.nombre || p.jid) ? { jid: p.jid || null, nombre: p.nombre || "", dorsal: p.dorsal || "" } : null; }
  function resultadoOf(c) {
    if (!isPA(c)) return "";
    var bp = c.batter.play, op = c.outPlay;
    if (bp) return bp.k3 ? "K3" : bp.code === "H" ? (RES_HIT[bp.n] || "1B") : (RES_BAT[bp.code] || bp.code);
    return op.code === "Kc" ? "KC" : op.code;
  }
  function baseOf(c) {
    if (scored(c)) return 4;
    var b = 0;
    while (b < 4 && c.lines[b] === 1) b++;
    return b;
  }
  function defsOf(op) { return op.seq ? op.seq.slice() : op.n ? [op.n] : []; }
  // Jugador del equipo t que ocupa la posición pos en el inning n
  function fielderAt(g, t, n, pos) {
    var team = g.equipos[t];
    for (var j = 0; j < nfil(team); j++) {
      var slot = team.lineup[j];
      if (String(posAt(slot, n)) === String(pos)) return activeAt(slot, n);
    }
    return null;
  }
  function buildTurnos(g) {
    ["visitante", "local"].forEach(function (t) {
      var team = g.equipos[t], fld = g.equipos[other(t)], idx = 0, nL = fld.lanzadores.length;
      gameOrder(team).forEach(function (o) {
        var c = o.c, n = o.col.n, op = c.outPlay, bp = c.batter.play;
        var w = whoAtD(g, t, o.row, o.col.id), lz = fld.lanzadores[idx] || {};
        var tu = {
          fila: o.row, inning: n, colId: o.col.id,
          bateador: personOf(w.bat), corredor: personOf(w.run), lanzador: personOf(lz),
          resultado: resultadoOf(c), aparicion: isPA(c), turnoOficial: isAB(c),
          baseAlcanzada: baseOf(c), carrera: scored(c), impulsadas: c.batter.rbi || 0, k3: !!(bp && bp.k3),
          lob: isLOB(c), out: null, avances: [], errores: [],
          direccion: c.dir ? { a: c.dir.a, r: c.dir.r } : null, lanzamientos: pitchesOf(c), desempate: !!c.desempate
        };
        if (c.out || op || c.lines.indexOf(2) >= 0) {
          tu.out = { num: c.out || null, comoCorredor: outAsRunner(c), tramo: c.lines.indexOf(2), codigo: op ? op.code : "", defensores: op ? defsOf(op) : [], mod: (op && op.mod) || "" };

    var nG = o.games.length, recs = o.results.slice().sort(function (a, b) { return a.date - b.date; });
    var w = 0, l = 0, rf = 0, ra = 0;
    recs.forEach(function (r) { if (r.rf > r.ra) w++; else if (r.rf < r.ra) l++; rf += r.rf; ra += r.ra; });
    var dates = [];
    games.forEach(function (rec) { if (o.games.indexOf(rec.id) >= 0) dates.push(gameDate(rec)); });
    dates.sort(function (a, b) { return a - b; });
    var unf = nG - recs.length;
    var sub = nG + (nG === 1 ? " partido" : " partidos") + (unf ? " (" + unf + " sin terminar)" : "") + (dates.length ? " · " + dRange(dates[0], dates[dates.length - 1]) : "");
    var nameSize = o.nombre.length > 12 ? 13 : o.nombre.length > 8 ? 16 : 20;
    var h = '<div class="sc-card"><div class="sc-head"><div class="sc-tag sc-cond" style="font-size:' + nameSize + 'pt">' + esc(o.nombre) + "</div>" +
      '<div class="sc-who"><h1 class="sc-cond">Todos los partidos</h1><p>' + esc(sub) + "</p></div>" +
      '<div class="sc-rec sc-cond"><div><b>' + w + "–" + l + "</b><span>G–P</span></div><div><b>" + rf + "</b><span>a favor</span></div><div><b>" + ra + "</b><span>en contra</span></div></div>" + brandHTML() + "</div>";
    // Resultados en dos columnas
    var heads = [{ h: "Fecha", l: 1 }, { h: "Rival", l: 1 }, { h: "Campo" }, { h: "Marcador" }, { h: "" }];
    function resRows(arr) {
      return arr.map(function (r) {
        var res = r.rf > r.ra ? "G" : r.rf < r.ra ? "P" : "E", cls = r.rf > r.ra ? "w" : "lo";
        return { cells: [dShort(r.date), esc(r.rival), r.campo, r.rf + "–" + r.ra + (r.extra ? " (" + r.extra + ")" : ""), res], cc: { 3: cls, 4: cls } };
      });
    }
    var half = Math.ceil(recs.length / 2);
    if (recs.length) {
      h += '<div class="sc-cols"><div class="sc-sec"><h2 class="sc-cond">Resultados</h2>' + tableHTML(heads, resRows(recs.slice(0, half))) + "</div>" +
        '<div class="sc-sec" style="padding-left:2mm"><h2 class="sc-cond">&nbsp;</h2>' + (recs.length > half ? tableHTML(heads, resRows(recs.slice(half))) : "") + "</div></div>";
    } else {
      h += '<div class="sc-sec"><h2 class="sc-cond">Resultados</h2><p class="sc-pos">Ningún partido marcado como terminado.</p></div>';
    }
    // Carreras por entrada
    if (o.maxInn) {
      var mx = 0, i, tf = 0, ta = 0;
      for (i = 1; i <= o.maxInn; i++) { mx = Math.max(mx, o.innFor[i] || 0, o.innAg[i] || 0); tf += o.innFor[i] || 0; ta += o.innAg[i] || 0; }
      var tb = '<table class="sc-inn"><thead><tr><th class="l">Entrada</th>';
      for (i = 1; i <= o.maxInn; i++) tb += "<th>" + i + "</th>";
      tb += "<th>TOT</th></tr></thead><tbody>";
      [["A favor", o.innFor, "", tf], ["En contra", o.innAg, " ag", ta]].forEach(function (row) {
        tb += '<tr><td class="l" rowspan="2">' + row[0] + "</td>";
        for (i = 1; i <= o.maxInn; i++) tb += '<td class="sc-barcell"><div class="sc-b' + row[2] + '" style="height:' + (mx ? Math.max(0.5, 12 * (row[1][i] || 0) / mx) : 0.5).toFixed(1) + 'mm"></div></td>';
        tb += '<td rowspan="2" class="w">' + row[3] + "</td></tr><tr>";
        for (i = 1; i <= o.maxInn; i++) tb += '<td class="sc-n">' + (row[1][i] || 0) + "</td>";
        tb += "</tr>";
      });
      tb += "</tbody></table>";
      h += '<div class="sc-sec"><h2 class="sc-cond">Carreras por entrada</h2>' + tb +
        '<div class="sc-legend"><span><i style="background:#000;border-radius:.5mm"></i>A favor</span><span><i style="background:#e0457b;border-radius:.5mm"></i>En contra</span></div></div>';
    }
    h += '<div class="sc-sec"><h2 class="sc-cond">Bateo del equipo</h2>' + trioHTML(o.bat) + '<div style="height:1.6mm"></div>' + batTable(o.bat) + "</div>";
    // Líderes y plantilla
    var minAB = Math.round(2.5 * nG);
    var ros = Object.keys(o.roster).map(function (k) { return o.roster[k]; });
    ros.forEach(function (r) {
      r.g = Object.keys(r.G).length;
      r.avg = r.bat.AB ? r.bat.H / r.bat.AB : 0;
      r.qual = r.bat.AB >= minAB;
      var cnt = {}, best = null;
      r.rows.forEach(function (x) { cnt[x] = (cnt[x] || 0) + 1; if (best === null || cnt[x] > cnt[best] || (cnt[x] === cnt[best] && x < best)) best = x; });
      r.ord = best === null ? 99 : best;
    });
    ros.sort(function (a, b) { return a.ord - b.ord || b.bat.PA - a.bat.PA; });
    function leader(val, ok) {
      var best = -1, names = [];
      ros.forEach(function (r) { if (ok && !ok(r)) return; var v = val(r); if (v > best) { best = v; names = [r.nombre]; } else if (v === best) names.push(r.nombre); });
      return best > 0 ? { v: best, n: names.length > 2 ? "Empate (" + names.length + ")" : names.join(" y ") } : { v: null, n: "—" };
    }
    var L = [
      ["AVG", leader(function (r) { return r.avg; }, function (r) { return r.qual; }), true],
      ["H", leader(function (r) { return r.bat.H; })], ["HR", leader(function (r) { return r.bat.HR; })],
      ["RBI", leader(function (r) { return r.bat.RBI; })], ["SB", leader(function (r) { return r.bat.SB; })]
    ];
    h += '<div class="sc-sec"><h2 class="sc-cond">Líderes <span class="sc-note">AVG: mínimo ' + minAB + ' AB</span></h2><div class="sc-leaders">' +
      L.map(function (x) {
        var v = x[1].v === null ? "—" : x[2] ? pct(x[1].v * 1000, 1000) : x[1].v;
        return '<div><span class="k sc-cond">' + x[0] + '</span><b class="sc-cond">' + v + "</b><span>" + esc(x[1].n) + "</span></div>";
      }).join("") + "</div></div>";
    var cols = ["#", "Jugador", "POS", "G", "PA", "AB", "H", "HR", "R", "RBI", "SB", "AVG", "OBP", "E"];
    var maxOf = {};
    ["PA", "AB", "H", "HR", "R", "RBI", "SB"].forEach(function (k) {
      maxOf[k] = Math.max.apply(null, ros.map(function (r) { return r.bat[k]; }).concat([0]));
    });
    var maxAvg = Math.max.apply(null, ros.filter(function (r) { return r.qual; }).map(function (r) { return r.avg; }).concat([0]));
    var tE = 0, prow = ros.map(function (r) {
      var b = r.bat; tE += r.E;
      var hi = {};
      [["PA", 4], ["AB", 5], ["H", 6], ["HR", 7], ["R", 8], ["RBI", 9], ["SB", 10]].forEach(function (x) {
        var v = b[x[0]];
        if (v > 0 && v === maxOf[x[0]]) hi[x[1]] = 1;
      });
      if (r.qual && r.avg > 0 && r.avg === maxAvg) hi[11] = 1;
      return { hi: hi, cells: [esc(r.dorsal), esc(r.nombre), topPos(r.pos), r.g, b.PA, b.AB, b.H, b.HR, b.R, b.RBI, b.SB, pct(b.H, b.AB), pct(b.H + b.BB + b.HbP, b.AB + b.BB + b.HbP + b.SF), r.E] };
    });
    var B = o.bat;
    prow.push({ cls: "tot", cells: ["", "Equipo", "", nG, B.PA, B.AB, B.H, B.HR, B.R, B.RBI, B.SB, pct(B.H, B.AB), pct(B.H + B.BB + B.HbP, B.AB + B.BB + B.HbP + B.SF), tE] });
    h += '<div class="sc-sec"><h2 class="sc-cond">Plantilla</h2>' + tableHTML(cols.map(function (c) { return { h: c, l: c === "Jugador" }; }), prow) + "</div>";
    // Defensa y lanzadores
    var pr = o.pitOrder.map(function (k) { return o.pitchers[k]; }), pt = { outs: 0, H: 0, R: 0, ER: 0, BB: 0, K: 0, HR: 0 };
    var prr = pr.map(function (q) {
      Object.keys(pt).forEach(function (k) { pt[k] += q[k]; });
      return { cells: [(q.dorsal ? "#" + esc(q.dorsal) + " " : "") + esc(q.nombre), ipFmt(q.outs), q.H, q.R, q.ER, q.BB, q.K, q.HR] };
    });
    prr.push({ cls: "tot", cells: ["Total", ipFmt(pt.outs), pt.H, pt.R, pt.ER, pt.BB, pt.K, pt.HR] });
    h += '<div class="sc-cols"><div class="sc-sec"><h2 class="sc-cond">Defensa</h2>' + miniHTML(o.def) + '<p class="sc-pos">Fildeo del equipo <strong>' + fild(o.def) + "</strong></p></div>" +
      '<div class="sc-sec" style="padding-left:0"><h2 class="sc-cond">Lanzadores</h2>' +
      tableHTML([{ h: "Lanzador", l: 1 }, { h: "IP" }, { h: "H" }, { h: "R" }, { h: "ER" }, { h: "BB" }, { h: "K" }, { h: "HR" }], prr) + "</div></div>";
    h += '<div class="sc-foot"><span>En rosa, el líder de cada columna de la plantilla.</span><span>Generado con Scorer el ' + todayTxt() + "</span></div></div>";
    return h;
  }

  // ---------- Pantalla «Estadísticas» e informe ----------
  var statsData = null, statsTab = "jug";
  var reportEl = document.getElementById("report"), repBody = document.getElementById("repBody");
  function showStats() {
    flushSave();
    statsData = computeAll();
    enterLevel("stats");
    renderStats();
  }
  function renderStats() {
    var S = statsData, h = [];
    document.getElementById("statsHint").textContent = S.n ? S.n + (S.n === 1 ? " partido" : " partidos") + " en este móvil" + (S.unf ? " · " + S.unf + " sin terminar" : "") : "Todavía no hay partidos anotados";
    document.querySelectorAll("#statsView .seg-b").forEach(function (b) { b.setAttribute("aria-selected", b.getAttribute("data-st") === statsTab ? "true" : "false"); });
    if (statsTab === "jug") {
      Object.keys(S.P).map(function (k) { return S.P[k]; }).sort(function (a, b) { return byName(a, b); }).forEach(function (o) {
        var n = Object.keys(o.games).length, tms = Object.keys(o.teams).sort(function (a, b) { return o.teams[b] - o.teams[a]; }).map(function (k) { return S.T[k] ? S.T[k].nombre : ""; }).filter(Boolean);
        h.push('<div class="game"><button type="button" class="game-main" data-rep="p:' + esc(o.key) + '"><span class="game-text"><span class="game-title">' + esc(o.nombre) + "</span>" +
          '<span class="game-sub">' + esc([o.dorsal ? "#" + o.dorsal : "", tms.join(", "), n + (n === 1 ? " partido" : " partidos")].filter(Boolean).join(" · ")) + "</span></span></button></div>");
      });
    } else {
      Object.keys(S.T).map(function (k) { return S.T[k]; }).sort(function (a, b) { return byName(a, b); }).forEach(function (o) {
        var w = 0, l = 0;
        o.results.forEach(function (r) { if (r.rf > r.ra) w++; else if (r.rf < r.ra) l++; });
        h.push('<div class="game"><button type="button" class="game-main" data-rep="t:' + esc(o.key) + '"><span class="game-text"><span class="game-title">' + esc(o.nombre) + "</span>" +
          '<span class="game-sub">' + o.games.length + (o.games.length === 1 ? " partido" : " partidos") + " · balance " + w + "–" + l + "</span></span></button></div>");
      });
    }
    if (!h.length) h.push('<div class="list-empty"><p>Anota algún partido para ver aquí los informes.</p></div>');
    document.getElementById("statsBody").innerHTML = h.join("");
  }
  function openReport(ref) {
    var S = statsData, kind = ref.slice(0, 1), key = ref.slice(2), o = kind === "p" ? S.P[key] : S.T[key];
    if (!o) return;
    document.getElementById("repTitle").textContent = (kind === "p" ? "Informe de jugador: " : "Informe de equipo: ") + o.nombre;
    repBody.innerHTML = '<div class="sc-scale">' + (kind === "p" ? playerCard(o, S) : teamCard(o, S)) + "</div>";
    reportEl.hidden = false;
    fitReport();
  }
  // Zoom y desplazamiento del informe, como en la hoja: pellizcar, arrastrar y «Ajustar»
  var rz = { s: 1, x: 0, y: 0, fit: 1 }, rzPtr = {}, rzG = null;
  function rzCard() { return repBody.querySelector(".sc-card"); }
  function rzClamp() {
    var card = rzCard(); if (!card) return;
    var W = repBody.clientWidth, H = repBody.clientHeight, w = card.offsetWidth * rz.s, h = card.offsetHeight * rz.s, m = 12;
    rz.x = w + 2 * m <= W ? (W - w) / 2 : Math.min(m, Math.max(W - w - m, rz.x));
    rz.y = h + 2 * m <= H ? m : Math.min(m, Math.max(H - h - m, rz.y));
  }
  function rzApply() {
    var sc = repBody.querySelector(".sc-scale"); if (!sc) return;
    rzClamp();
    sc.style.transform = "translate(" + rz.x + "px," + rz.y + "px) scale(" + rz.s + ")";
  }
  function rzZoomAt(s, cx, cy) {
    var r = repBody.getBoundingClientRect(), px = cx - r.left, py = cy - r.top;
    s = Math.max(rz.fit * 0.8, Math.min(4, s));
    rz.x = px - (px - rz.x) * s / rz.s; rz.y = py - (py - rz.y) * s / rz.s; rz.s = s;
    rzApply();
  }
  function fitReport() {
    var card = rzCard(); if (!card || reportEl.hidden) return;
    rz.fit = Math.min(1, (repBody.clientWidth - 24) / card.offsetWidth);
    rz.s = rz.fit; rz.x = 0; rz.y = 12;
    rzApply();
  }
  function rzPts() { return Object.keys(rzPtr).map(function (k) { return rzPtr[k]; }); }
  repBody.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    try { repBody.setPointerCapture(e.pointerId); } catch (err) { /* sin captura */ }
    rzPtr[e.pointerId] = { x: e.clientX, y: e.clientY };
    var p = rzPts();
    rzG = { s0: rz.s, x0: rz.x, y0: rz.y, p0: p.map(function (q) { return { x: q.x, y: q.y }; }) };
    if (p.length >= 2) { rzG.d0 = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1; rzG.m0 = { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 }; }
  });
  repBody.addEventListener("pointermove", function (e) {
    if (!rzPtr[e.pointerId] || !rzG) return;
    rzPtr[e.pointerId] = { x: e.clientX, y: e.clientY };
    var p = rzPts(), r = repBody.getBoundingClientRect();
    if (p.length >= 2 && rzG.d0) {
      var d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), m = { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 };
      var s = Math.max(rz.fit * 0.8, Math.min(4, rzG.s0 * d / rzG.d0));
      var cx = (rzG.m0.x - r.left - rzG.x0) / rzG.s0, cy = (rzG.m0.y - r.top - rzG.y0) / rzG.s0;
      rz.s = s; rz.x = (m.x - r.left) - cx * s; rz.y = (m.y - r.top) - cy * s;
    } else if (p.length === 1) {
      rz.x = rzG.x0 + (p[0].x - rzG.p0[0].x); rz.y = rzG.y0 + (p[0].y - rzG.p0[0].y);
    }
    rzApply();
  });
  function rzEnd(e) {
    delete rzPtr[e.pointerId];
    var p = rzPts();
    rzG = p.length ? { s0: rz.s, x0: rz.x, y0: rz.y, p0: p.map(function (q) { return { x: q.x, y: q.y }; }) } : null;
  }
  repBody.addEventListener("pointerup", rzEnd);
  repBody.addEventListener("pointercancel", rzEnd);
  repBody.addEventListener("wheel", function (e) {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) rzZoomAt(rz.s * Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY);
    else { rz.x -= e.deltaX; rz.y -= e.deltaY; rzApply(); }
  }, { passive: false });
  repBody.addEventListener("dblclick", function (e) {
    if (rz.s > rz.fit * 1.05) fitReport(); else rzZoomAt(rz.fit * 2, e.clientX, e.clientY);
  });
  document.getElementById("repFit").addEventListener("click", fitReport);
  function closeReport() { reportEl.hidden = true; repBody.innerHTML = ""; }
  window.addEventListener("resize", fitReport);
  document.getElementById("homeStats").addEventListener("click", showStats);
  document.getElementById("statsBack").addEventListener("click", backToHome);
  document.getElementById("repBack").addEventListener("click", closeReport);
  document.querySelectorAll("#statsView .seg-b").forEach(function (b) {
    b.addEventListener("click", function () { statsTab = b.getAttribute("data-st"); renderStats(); });
  });
  document.getElementById("statsBody").addEventListener("click", function (e) {
    var b = e.target.closest("[data-rep]");
    if (b) openReport(b.getAttribute("data-rep"));
  });

  // ---------- Inicio ----------
  initApp();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { ensureView(); });
})();
</script>
</body>
